<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاسبه‌گر قیمت لایسنس بی‌سیم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f4;--surf:#fff;--ink:#0f1c24;--mut:#5b6b75;--line:#cdd7dc;--ok:#0b7a75;--low:#b4412f;--acc:#0f1c24;--accInk:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d171c;--surf:#14232b;--ink:#e8f0f3;--mut:#93a5af;--line:#27404b;--ok:#4fd1c5;--low:#ff8a73;--acc:#e8f0f3;--accInk:#0d171c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d171c;--surf:#14232b;--ink:#e8f0f3;--mut:#93a5af;--line:#27404b;--ok:#4fd1c5;--low:#ff8a73;--acc:#e8f0f3;--accInk:#0d171c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:19px;margin:0 0 14px;font-weight:800}
h2{font-size:15px;margin:0;font-weight:600}
.box{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#n{font-size:26px;font-weight:800;text-align:center;direction:ltr}
.row{display:flex;gap:8px;align-items:flex-end}
.row>div{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 12px;background:var(--acc);color:var(--accInk)}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.st{font-size:12.5px;color:var(--mut);margin-top:6px;min-height:20px}
.res{padding:0}
.it{padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it h2{margin-bottom:6px}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr b{display:block;font-size:19px;font-weight:800;direction:ltr;text-align:right}
.pr small{display:block;color:var(--mut);font-size:12px}
.pr .lo b{color:var(--low)}
.pr .hi b{color:var(--ok)}
.pr .t{font-size:12px;color:var(--mut);direction:ltr;text-align:right}
.pr .pu{font-size:12.5px;margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
.nt{font-size:12.5px;color:var(--mut);margin-top:4px}
details summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;margin:10px 0}
td,th{padding:3px;font-size:12.5px;color:var(--mut);font-weight:400;text-align:center}
td input{padding:6px 4px;text-align:center;direction:ltr}
.p{margin-top:10px}
</style>
</head>
<body>
<main>
<h1>محاسبه‌گر قیمت لایسنس بی‌سیم</h1>

<div class="box">
  <label for="n">تعداد کاربر</label>
  <input id="n" inputmode="numeric" autocomplete="off">
</div>

<div class="box">
  <div class="row">
    <div><label for="rate">نرخ دلار (ریال)</label><input id="rate" inputmode="numeric" placeholder="مثلاً ۱۸۶۴۰۰۰" style="direction:ltr"></div>
    <button id="get" type="button">دریافت از API</button>
  </div>
  <div class="st" id="st">نرخ را دستی وارد کن یا آدرس API را در تنظیمات بگذار.</div>
</div>

<div class="box res" id="res"></div>

<details class="box">
  <summary>تنظیمات و قیمت‌های پیش‌فرض</summary>
  <div class="p"><label for="api">آدرس API نرخ دلار (JSON)</label>
  <input id="api" style="direction:ltr" placeholder="https://.../api/price/currency"></div>
  <div class="nt">فرمت‌های پشتیبانی‌شده: آرایه‌ای با کلید price_dollar_rl (قیمت به ریال)، یا شیء با فیلد rate یا price یا value.</div>
  <table id="tt"></table>
  <div id="pp"></div>
  <div class="row p"><button class="g" id="reset" type="button">بازگشت به پیش‌فرض</button></div>
</details>
</main>

<script>
var D={tiers:[[20,18,200,400],[50,14,200,400],[100,11,200,400],[150,10,200,500],[300,8,200,500],[600,6,500,1200],[1500,4,1000,2500],[1e9,3,2000,5000]],
hi:1.15,lo:0.8,perp:2.5,sup:0.25,srcLo:8,srcHi:10,revLo:10000,revHi:20000,mLo:1.5,mHi:1.75,disc:0.1,rate:0,api:'',n:150};
var PM=[['hi','ضریب پیشنهاد اول'],['lo','ضریب کف (حداقل قابل قبول)'],['perp','ضریب لایسنس دائمی نسبت به اشتراک سالانه'],['sup','پشتیبانی سال دوم، نسبت به لایسنس دائمی (۰٫۲۵ = ۲۵٪)'],['srcLo','ضریب کف فروش سورس (نسبت به اشتراک سالانه)'],['srcHi','ضریب پیشنهاد اول فروش سورس'],['revLo','واگذاری کامل: درآمد سالانه کم (دلار)'],['revHi','واگذاری کامل: درآمد سالانه زیاد (دلار)'],['mLo','واگذاری کامل: ضریب کف'],['mHi','واگذاری کامل: ضریب بالا'],['disc','تخفیف سهم صاحب ایده (۰٫۱ = ۱۰٪)']];
var S=load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{var x=JSON.parse(localStorage.getItem('plc1'));if(x)return Object.assign(clone(D),x)}catch(e){}return clone(D)}
function save(){try{localStorage.setItem('plc1',JSON.stringify(S))}catch(e){}}
function num(v){var s=String(v==null?'':v).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/٫/g,'.').replace(/[^0-9.]/g,'');return parseFloat(s)||0}
function fmt(x){return Math.round(x).toLocaleString('fa-IR')}
function usd(x){return '$'+fmt(x)}
function rial(x){return S.rate>0?fmt(Math.round(x*S.rate/10000)*10000)+' ریال':''}
function base(n){var t=S.tiers,tot=0,i,p;for(i=0;i<t.length;i++){p=t[i][0]*t[i][1];if(n<=t[i][0]||i==t.length-1){return {total:Math.max(n*t[i][1],tot),i:i}}tot=Math.max(p,tot)}}
function pu(x){return '$'+x.toLocaleString('fa-IR',{maximumFractionDigits:1})}
function pair(lo,hi){function c(cls,l,v){var u=v/S.n;return '<div class="'+cls+'"><small>'+l+'</small><b>'+usd(v)+'</b><div class="t">'+rial(v)+'</div><div class="pu">هر کاربر: '+pu(u)+'<div class="t">'+rial(u)+'</div></div></div>'}return '<div class="pr">'+c('lo','کف (کمتر قبول نکن)',lo)+c('hi','پیشنهاد اول',hi)+'</div>'}
function item(t,lo,hi,note){return '<div class="it"><h2>'+t+'</h2>'+pair(lo,hi)+(note?'<div class="nt">'+note+'</div>':'')+'</div>'}
function render(){
 var n=S.n,b=base(n),t=S.tiers[b.i],A=b.total,P=A*S.perp,su=P*S.sup,h='';
 h+=item('اشتراک سالانه',A*S.lo,A*S.hi,'نرخ پایه هر کاربر: '+usd(A/n)+' در سال');
 h+=item('لایسنس دائمی بدون سورس',P*S.lo,P*S.hi,'پشتیبانی و آپدیت سال اول رایگان');
 h+=item('پشتیبانی از سال دوم (در سال)',su*S.lo,su*S.hi,'فقط آپدیت و رفع باگ');
 h+=item('نصب و راه‌اندازی (یکبار)',t[2],t[3],'جدا از لایسنس حساب شود');
 h+=item('جمع سال اول، اشتراک',A*S.lo+t[2],A*S.hi+t[3]);
 h+=item('جمع سال اول، لایسنس دائمی',P*S.lo+t[2],P*S.hi+t[3]);
 h+=item('فروش سورس به مشتری',A*S.srcLo,A*S.srcHi,'فقط با قرارداد منع بازفروش');
 var f=S.revLo*S.mLo*(1-S.disc),o=S.revHi*S.mHi*(1-S.disc);
 h+=item('واگذاری کامل سورس و حقوق به صاحب ایده',f,o,'مستقل از تعداد کاربر؛ بر اساس درآمد سالانه پیش‌بینی‌شده');
 document.getElementById('res').innerHTML=h;
}
function tiers(){
 var h='<tr><th>تا کاربر</th><th>$ هر کاربر</th><th>نصب حداقل</th><th>نصب حداکثر</th></tr>';
 S.tiers.forEach(function(r,i){h+='<tr><td>'+(i==S.tiers.length-1?'بیشتر':'<input data-r="'+i+'" data-c="0" value="'+r[0]+'">')+'</td>'+[1,2,3].map(function(c){return '<td><input data-r="'+i+'" data-c="'+c+'" value="'+r[c]+'"></td>'}).join('')+'</tr>'});
 document.getElementById('tt').innerHTML=h;
}
function params(){
 document.getElementById('pp').innerHTML=PM.map(function(p){return '<div class="p"><label>'+p[1]+'</label><input data-k="'+p[0]+'" value="'+S[p[0]]+'" style="direction:ltr"></div>'}).join('');
}
function fill(){document.getElementById('n').value=S.n;document.getElementById('rate').value=S.rate||'';document.getElementById('api').value=S.api;tiers();params();render()}
document.getElementById('n').addEventListener('input',function(e){var v=num(e.target.value);S.n=v>0?v:1;save();render()});
document.getElementById('rate').addEventListener('input',function(e){S.rate=num(e.target.value);save();render()});
document.getElementById('api').addEventListener('input',function(e){S.api=e.target.value.trim();save()});
document.getElementById('tt').addEventListener('input',function(e){var d=e.target.dataset;if(d.r==null)return;var v=num(e.target.value);S.tiers[+d.r][+d.c]=v;save();render()});
document.getElementById('pp').addEventListener('input',function(e){var k=e.target.dataset.k;if(!k)return;S[k]=num(e.target.value);save();render()});
document.getElementById('reset').addEventListener('click',function(){var r=S.rate,a=S.api;S=clone(D);S.rate=r;S.api=a;save();fill()});
document.getElementById('get').addEventListener('click',function(){
 var st=document.getElementById('st');
 if(!S.api){st.textContent='ابتدا آدرس API را در تنظیمات وارد کن.';return}
 st.textContent='در حال دریافت...';
 getJSON(S.api).then(function(j){
  var v;if(Array.isArray(j)){var x=j.filter(function(i){return i.key==='price_dollar_rl'})[0];v=x&&x.price}else{v=j.rate||j.price||j.value}
  v=num(v);if(!v)throw 0;S.rate=v;save();document.getElementById('rate').value=v;render();
  st.textContent='نرخ دریافت شد: '+fmt(v)+' ریال';
 }).catch(function(){st.textContent='دریافت نشد (آدرس، دسترسی اینترنت یا محدودیت CORS). نرخ را دستی وارد کن.'});
});
function getJSON(u){if(window.Android&&Android.get){return new Promise(function(res,rej){var cb='cb'+Date.now();window[cb]=function(t,err){delete window[cb];if(err){rej(err);return}try{res(JSON.parse(t))}catch(e){rej(e)}};Android.get(u,cb)})}return fetch(u,{cache:'no-store'}).then(function(r){return r.json()})}
fill();
</script>
</body>
</html>
